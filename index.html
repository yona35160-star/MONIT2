<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TAXIPRO - האפליקציה המתקדמת בישראל להזמנת מוניות עם שקיפות מלאה במחיר, מערכת Bidding Slider ייחודית ושירות פרימיום לנתבג ולכל חלקי הארץ." />
  <meta name="theme-color" content="#FACC15" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>TAXIPRO | הזמנת מוניות שקופות בישראל - מחיר ידוע מראש & Bidding Slider</title>

  <!-- Performance & DNS Prefetch -->
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://accounts.google.com">
  <link rel="dns-prefetch" href="https://telegram.org">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- AI & Search Bot Optimizations -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://taxiil.netlify.app/#organization",
        "name": "TAXIPRO",
        "url": "https://taxiil.netlify.app/",
        "logo": "https://taxiil.netlify.app/icons/icon-512.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": "Hebrew"
        },
        "sameAs": [
          "https://taxiproil.netlify.app"
        ],
        "description": "הפלטפורמה המקיפה בישראל להזמנת מוניות ונסיעות חכמות עם נתוני זמן אמת ושקיפות מלאה."
      },
      {
        "@type": "SoftwareApplication",
        "name": "TAXIPRO Passenger App",
        "operatingSystem": "Web, Android, iOS",
        "applicationCategory": "TravelApplication",
        "url": "https://taxiil.netlify.app/",
        "author": {
          "@id": "https://taxiil.netlify.app/#organization"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "ILS"
        }
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "איך מזמינים מונית לנתבג ובודקים מחיר?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "מזינים נקודת איסוף ואת הבחירה בנתבג באפליקציה, ומקבלים באופן שקוף את תעריף הנסיעה הצפוי לפני האישור הסופי."
            }
          },
          {
            "@type": "Question",
            "name": "האם ניתן להוסיף תמריץ כספי (טיפ) כדי לזרז נהגים?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "כן, ב-TAXIPRO קיים Bidding Slider שמאפשר להוסיף סכום תמריץ סמלי שיעלה את עדיפות הקריאה שלכם מול הנהגים הפנויים."
            }
          }
        ]
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"

    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Telegram Web App Script - Load only inside Telegram context -->
  <script>
    (function () {
      var isTelegramContext = (
        (window.Telegram && window.Telegram.WebApp) ||
        window.location.search.includes('tgWebAppData') ||
        window.parent !== window
      );
      if (isTelegramContext) {
        var s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        document.head.appendChild(s);
      }
    })();
  </script>


  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
