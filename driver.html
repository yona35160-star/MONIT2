<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0;url=/app.html?role=driver" />
  <title>TAXIPRO | מעביר...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      var u = new URL('/app.html', window.location.origin);
      u.searchParams.set('role', 'driver');
      try {
        var src = new URL(window.location.href);
        src.searchParams.forEach(function (v, k) {
          if (k !== 'role') u.searchParams.set(k, v);
        });
      } catch (e) {}
      if (window.location.hash) u.hash = window.location.hash;
      window.location.replace(u.pathname + u.search + u.hash);
    })();
  </script>
</head>
<body>
  <p style="font-family:Heebo,sans-serif;text-align:center;margin-top:3rem;direction:rtl">מעבירים לאפליקציית נסיעה...</p>
</body>
</html>
