# Build settings are managed in the Netlify UI for each specialized site
# [build]
#   command = "npm run build:all"
#   publish = "dist"

[build.environment]
  # Firebase client-side config is public by design — safe to exclude from secrets scanning
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_DATABASE_URL,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_VAPID_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
